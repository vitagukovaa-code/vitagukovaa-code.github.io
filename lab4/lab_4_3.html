<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление вертикального меню</title>
    <style>
        html {
            background: #f0f0f0;
        }

        .menu {
            width: 200px;
            background: #fff;
        }

        /* убираем стандартные маркеры списков */
        .menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* добавляем relative для позиционирования псевдоэлемента */
        .menu li a {
            position: relative;   /* единственное дополнение для спрайта */
        }

        .menu li a:hover {
        }

        .menu li ul {
            margin-left: 20px;
        }

        /* минус (спрайт) для главных заголовков */
        .menu > ul > li > a::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: url('pic/css_sprites.png') no-repeat;
            background-position: -10px -10px;   /* координаты минуса */
        }

        /* точка (спрайт) для подзаголовков */
        .menu li li a::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: url('pic/css_sprites.png') no-repeat;
            background-position: -82px -10px;   /* координаты точки */
            /*.bg-minus {
    width: 16px; height: 16px;
    background: url('css_sprites.png') -10px -10px;
}*/
/*.bg-plus {
    width: 16px; height: 16px;
    background: url('css_sprites.png') -46px -10px;
}*/
/*.bg-point {
    width: 16px; height: 16px;
    background: url('css_sprites.png') -82px -10px;
}*/
        }

        /* сохраняем отступы, чтобы текст не наезжал на иконку */
        .menu > ul > li > a {
            padding-left: 30px;
        }
        .menu li li a {
            padding-left: 28px;
        }
    </style>
</head>
<body>
    <nav class="menu">
        <ul>
            <li><a href="#">Фильмы</a>
                <ul>
                    <li><a href="#">Экшн</a></li>
                    <li><a href="#">Мелодрамы</a></li>
                    <li><a href="#">Сериалы</a></li>
                    <li><a href="#">Семейные</a></li>
                </ul>
            </li>
            <li><a href="#">Музыка</a>
                <ul>
                    <li><a href="#">Классика</a></li>
                    <li><a href="#">Джаз</a></li>
                    <li><a href="#">Рок</a></li>
                    <li><a href="#">Грандж</a></li>
                </ul>
            </li>
            <li><a href="#">Софт</a>
                <ul>
                    <li><a href="#">Графика</a></li>
                    <li><a href="#">3D-моделирование</a></li>
                    <li><a href="#">Машинопись</a></li>
                    <li><a href="#">Переводчики</a></li>
                </ul>
            </li>
            <li><a href="#">Игры</a>
                <ul>
                    <li><a href="#">РПГ</a></li>
                    <li><a href="#">Шутеры</a></li>
                    <li><a href="#">Пасьянсы</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</body>
</html>
