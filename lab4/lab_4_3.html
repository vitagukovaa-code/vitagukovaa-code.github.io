<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление вертикального меню (спрайт)</title>
    <style>
        html { background: #f0f0f0; }
        .menu { width: 200px; background: #fff; }
        .menu ul { margin: 0; padding: 0; list-style: none; }
        .menu li a {
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            color: #333;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .menu li a:hover { background-color: #e0e0e0; }
        .menu li ul { margin-left: 20px; }

        /* Общие настройки иконки */
        .menu li a::before {
            content: "";
            display: inline-block;
            width: 16px;
            height: 16px;
            background: url('pic/css_sprites.png') no-repeat; /* ← проверьте путь */
            margin-right: 8px;
            vertical-align: middle;
        }
        /* Минус для главных пунктов */
        .menu > ul > li > a::before {
            background-position: -10px -10px;
        }
        /* Точка для подпунктов */
        .menu li li a::before {
            background-position: -82px -10px;
        }
    </style>
</head>
<body>
    <nav class="menu">
        <ul>
            <li><a href="#">Фильмы</a>
                <ul>
                    <li><a href="#">Экшн</a></li>
                    <li><a href="#">Мелодрамы</a></li>
                    <li><a href="#">Сериалы</a></li>
                    <li><a href="#">Семейные</a></li>
                </ul>
            </li>
            <li><a href="#">Музыка</a>
                <ul>
                    <li><a href="#">Классика</a></li>
                    <li><a href="#">Джаз</a></li>
                    <li><a href="#">Рок</a></li>
                    <li><a href="#">Грандж</a></li>
                </ul>
            </li>
            <li><a href="#">Софт</a>
                <ul>
                    <li><a href="#">Графика</a></li>
                    <li><a href="#">3D-моделирование</a></li>
                    <li><a href="#">Машинопись</a></li>
                    <li><a href="#">Переводчики</a></li>
                </ul>
            </li>
            <li><a href="#">Игры</a>
                <ul>
                    <li><a href="#">РПГ</a></li>
                    <li><a href="#">Шутеры</a></li>
                    <li><a href="#">Пасьянсы</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</body>
</html>
