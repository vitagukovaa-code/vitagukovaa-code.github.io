<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вертикальное меню (белые кнопки)</title>
    <style>
        .menu {
            width: 200px;
            background: blue;
        }

        .menu ul {
            list-style: none;
            margin: 0;
            padding: 10px;
        }

        .menu li {
            margin-bottom: 10px;
            /* расстояние между кнопками */
        }

        .menu li:last-child {
            margin-bottom: 0;
        }

        .menu li a {
            display: block;
            padding: 10px;
            text-transform: uppercase;
            text-decoration: none;
            background: white;
            color: blue;
            text-align: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .menu li a:hover {
            background: yellow;
            color: black;
        }
    </style>
</head>

<body>
    <nav class="menu">
        <ul>
            <li><a href="#">Фильмы</a></li>
            <li><a href="#">Музыка</a></li>
            <li><a href="#">Софт</a></li>
            <li><a href="#">Игры</a></li>
        </ul>
    </nav>
</body>

</html>
