<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вертикальное меню (белые кнопки)</title>
    <style>
        .menu {
            width: 200px;
            background: blue;   /* синий фон меню */
        }
        .menu ul {
            list-style: none;
            margin: 0;
            padding: 10px;         /* отступы внутри меню */
        }
        .menu li {
            margin-bottom: 10px;   /* расстояние между кнопками */
        }
        .menu li:last-child {
            margin-bottom: 0;
        }
        .menu li a {
            display: block;
            padding: 10px;
            text-transform: uppercase;
            text-decoration: none;
            background: white;     /* БЕЛЫЙ ФОН КНОПКИ */
            color: blue;        /* СИНИЙ ТЕКСТ */
            text-align: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 5px;    /* небольшие скругления (опционально) */
        }
        .menu li a:hover {
            background: yellow;    /* золотистый фон при наведении */
            color: black;           /* чёрный текст при наведении */
        }
    </style>
</head>
<body>
    <nav class="menu">
        <ul>
            <li><a href="#">Фильмы</a></li>
            <li><a href="#">Музыка</a></li>
            <li><a href="#">Софт</a></li>
            <li><a href="#">Игры</a></li>
        </ul>
    </nav>
</body>
</html>
